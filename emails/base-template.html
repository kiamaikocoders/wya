<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>{{subject}}</title>
    <!--[if mso]>
    <style type="text/css">
        body, table, td {font-family: Arial, sans-serif !important;}
    </style>
    <![endif]-->
</head>
<body style="margin: 0; padding: 0; background-color: #181410; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background-color: #181410;">
        <tr>
            <td align="center" style="padding: 40px 20px;">
                <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="max-width: 600px; background-color: #211a14; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);">
                    <!-- Header -->
                    <tr>
                        <td style="background: linear-gradient(135deg, #FF8000 0%, #FFA94D 100%); padding: 30px 40px; text-align: center;">
                            <h1 style="margin: 0; color: #181410; font-size: 28px; font-weight: 700; letter-spacing: -0.5px;">WYA</h1>
                            <p style="margin: 8px 0 0 0; color: #181410; font-size: 14px; font-weight: 500; opacity: 0.9;">Find the Pulse of Kenya's Events</p>
                        </td>
                    </tr>
                    
                    <!-- Content -->
                    <tr>
                        <td style="padding: 40px; background-color: #211a14;">
                            {{content}}
                        </td>
                    </tr>
                    
                    <!-- Footer -->
                    <tr>
                        <td style="padding: 30px 40px; background-color: #181410; border-top: 1px solid rgba(255, 255, 255, 0.1); text-align: center;">
                            <p style="margin: 0 0 12px 0; color: #BCAB9A; font-size: 13px; line-height: 1.6;">
                                Questions? Contact us at <a href="mailto:support@wyakenya.com" style="color: #FF8000; text-decoration: none;">support@wyakenya.com</a>
                            </p>
                            <p style="margin: 0; color: #BCAB9A; font-size: 12px; opacity: 0.7;">
                                © 2025 WYA Kenya. All rights reserved.
                            </p>
                            <p style="margin: 16px 0 0 0; color: #BCAB9A; font-size: 11px; opacity: 0.6;">
                                You're receiving this email because you have an account with WYA.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
