<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Simplified location pin with heart for favicon -->
  <defs>
    <linearGradient id="pinGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8000;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF69B4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B00FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Location pin shape -->
  <path d="M16 2 C10 2, 6 6, 6 12 C6 18, 16 30, 16 30 C16 30, 26 18, 26 12 C26 6, 22 2, 16 2 Z" 
        fill="url(#pinGradient)" 
        stroke="#FFFFFF" 
        stroke-width="0.5"/>
  
  <!-- Heart shape in center -->
  <path d="M16 18 C14 16, 12 14, 12 12 C12 10, 13 9, 14 9 C15 9, 16 10, 16 11 C16 10, 17 9, 18 9 C19 9, 20 10, 20 12 C20 14, 18 16, 16 18 Z" 
        fill="#FFFFFF" 
        opacity="0.95"/>
</svg>

